<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>Lexy Goad</title>
  <meta name="description" content="Lexy Goad: developer, creator and engineer. Resume, projects and writing.">
  <meta name="theme-color" content="#e2e6e4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    #dots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .intro {
      padding: 0 var(--gutter) 2.5rem;
      text-align: center;
    }

    .intro p {
      font-style: italic;
      color: var(--ink-soft);
      margin-bottom: 1.25rem;
    }

    .intro nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 2rem;
      font-family: var(--sans);
      font-size: 0.9375rem;
    }

    .intro nav a {
      padding-block: 0.25rem;
    }

    .site-header {
      justify-content: flex-start;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <span class="home">deaddog.dev</span>
  </header>

  <main class="stage">
    <h1 class="visually-hidden">Lexy Goad</h1>
    <canvas id="dots" aria-hidden="true"></canvas>
  </main>

  <div class="intro">
    <p>Developer, creator, engineer.</p>
    <nav aria-label="Main">
      <a href="resume.html">Resume</a>
      <a href="vhdl-logisim.html">VHDL to Logisim</a>
      <a href="degree-tracker.html">Degree tracker</a>
      <a href="blog.html">Blog</a>
      <a href="mailto:lexy.goad@gmail.com">Email</a>
    </nav>
  </div>

  <script>
    (() => {
      "use strict";

      // 5x7 bitmap letters. 1 = dot.
      const GLYPHS = {
        A: ["00100", "01010", "10001", "10001", "11111", "10001", "10001"],
        D: ["11100", "10010", "10001", "10001", "10001", "10010", "11100"],
        E: ["11111", "10000", "10000", "11110", "10000", "10000", "11111"],
        G: ["01110", "10001", "10000", "10111", "10001", "10001", "01110"],
        L: ["10000", "10000", "10000", "10000", "10000", "10000", "11111"],
        O: ["01110", "10001", "10001", "10001", "10001", "10001", "01110"],
        X: ["10001", "10001", "01010", "00100", "01010", "10001", "10001"],
        Y: ["10001", "10001", "01010", "00100", "00100", "00100", "00100"],
        " ": ["00000", "00000", "00000", "00000", "00000", "00000", "00000"],
      };

      const TEXT = "LEXY GOAD";
      const COLS = 5;
      const ROWS = 7;

      const REPEL_RADIUS = 110;
      const REPEL_FORCE = 7000;
      const SPRING = 0.045;
      const DAMPING = 0.82;
      const LINK_DIST = 80;

      const INK = "20, 32, 31";
      const MARK = "160, 24, 92";

      const canvas = document.getElementById("dots");
      const ctx = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      let width = 0;
      let height = 0;
      let dpr = 1;
      let nodes = [];
      let pointer = { x: -9999, y: -9999 };
      let running = false;

      function build() {
        nodes = [];
        const totalCols = TEXT.length * COLS + (TEXT.length - 1);
        const cell = Math.min((width * 0.8) / totalCols, (height * 0.5) / ROWS);
        const startX = (width - totalCols * cell) / 2;
        const startY = (height - ROWS * cell) / 2;

        let offset = 0;
        for (const ch of TEXT) {
          const glyph = GLYPHS[ch];
          for (let row = 0; row < ROWS; row++) {
            for (let col = 0; col < COLS; col++) {
              if (glyph[row][col] !== "1") continue;
              const hx = startX + offset + col * cell + cell / 2;
              const hy = startY + row * cell + cell / 2;
              const scatter = reduceMotion.matches ? 0 : 400;
              nodes.push({
                hx,
                hy,
                x: hx + (Math.random() - 0.5) * scatter,
                y: hy + (Math.random() - 0.5) * scatter,
                vx: 0,
                vy: 0,
                r: cell * 0.2,
              });
            }
          }
          offset += (COLS + 1) * cell;
        }
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = canvas.clientWidth;
        height = canvas.clientHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        build();
        if (!running) frame();
      }

      function step() {
        const r2 = REPEL_RADIUS * REPEL_RADIUS;
        for (const n of nodes) {
          n.vx += (n.hx - n.x) * SPRING;
          n.vy += (n.hy - n.y) * SPRING;

          const dx = n.x - pointer.x;
          const dy = n.y - pointer.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < r2 && d2 > 0.01) {
            const d = Math.sqrt(d2);
            const f = REPEL_FORCE / d2;
            n.vx += (dx / d) * f;
            n.vy += (dy / d) * f;
          }

          n.vx *= DAMPING;
          n.vy *= DAMPING;
          n.x += n.vx;
          n.y += n.vy;
        }
      }

      function paint() {
        ctx.clearRect(0, 0, width, height);

        // Thin links between nearby dots.
        const max2 = LINK_DIST * LINK_DIST;
        ctx.lineWidth = 0.75;
        for (let i = 0; i < nodes.length; i++) {
          const a = nodes[i];
          for (let j = i + 1; j < nodes.length; j++) {
            const b = nodes[j];
            const dx = a.x - b.x;
            if (dx > LINK_DIST || dx < -LINK_DIST) continue;
            const dy = a.y - b.y;
            const d2 = dx * dx + dy * dy;
            if (d2 > max2) continue;
            const alpha = (1 - Math.sqrt(d2) / LINK_DIST) * 0.5;
            ctx.strokeStyle = `rgba(${INK}, ${alpha})`;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }

        // Dots. Anything pushed away from its spot turns magenta.
        for (const n of nodes) {
          const away = Math.hypot(n.x - n.hx, n.y - n.hy);
          ctx.fillStyle = away > 24 ? `rgb(${MARK})` : `rgb(${INK})`;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function frame() {
        step();
        paint();
        if (!reduceMotion.matches) {
          running = true;
          requestAnimationFrame(frame);
        } else {
          running = false;
        }
      }

      function setPointer(e) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = e.clientX - rect.left;
        pointer.y = e.clientY - rect.top;
        if (reduceMotion.matches && !running) frame();
      }

      canvas.addEventListener("pointermove", setPointer);
      canvas.addEventListener("pointerdown", setPointer);
      canvas.addEventListener("pointerleave", () => {
        pointer.x = pointer.y = -9999;
      });

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 120);
      });

      resize();
      if (!running) frame();
    })();
  </script>
</body>
</html>
