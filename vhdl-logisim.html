<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>VHDL to Logisim | Lexy Goad</title>
  <meta name="description" content="Write VHDL, get a gate-level circuit diagram you can rebuild in Logisim.">
  <link rel="stylesheet" href="assets/vhdl.css">
  <!-- Monaco editor loader. Deferred scripts run in order, so the loader is ready before vhdl.js. -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script defer src="assets/vhdl.js"></script>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div id="toolbar-left">
        <div id="logo">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <rect x="1" y="1" width="20" height="20" rx="2" fill="#4a6ea8" stroke="#2d4f8a" stroke-width="1.5"/>
            <text x="11" y="15" text-anchor="middle" fill="white" font-size="11" font-weight="bold" font-family="serif">L</text>
          </svg>
          <span>VHDL → Logisim</span>
        </div>
      </div>
      <div id="toolbar-center">
        <button class="tb-btn" id="btn-synthesize" onclick="synthesize()">
          <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="2,1 13,7 2,13" fill="currentColor"/></svg>
          Synthesize
        </button>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="btn-zoom-in" onclick="zoom(1.2)" title="Zoom In">
          <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="6" cy="6" r="5" stroke="currentColor" fill="none" stroke-width="1.5"/><line x1="6" y1="3" x2="6" y2="9" stroke="currentColor" stroke-width="1.5"/><line x1="3" y1="6" x2="9" y2="6" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="10" x2="13" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button class="tb-btn" id="btn-zoom-out" onclick="zoom(0.833)" title="Zoom Out">
          <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="6" cy="6" r="5" stroke="currentColor" fill="none" stroke-width="1.5"/><line x1="3" y1="6" x2="9" y2="6" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="10" x2="13" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button class="tb-btn" id="btn-fit" onclick="fitToScreen()" title="Fit to Screen">
          <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="5" height="5" stroke="currentColor" fill="none" stroke-width="1.3"/><rect x="8" y="1" width="5" height="5" stroke="currentColor" fill="none" stroke-width="1.3"/><rect x="1" y="8" width="5" height="5" stroke="currentColor" fill="none" stroke-width="1.3"/><rect x="8" y="8" width="5" height="5" stroke="currentColor" fill="none" stroke-width="1.3"/></svg>
        </button>
        <div class="tb-sep"></div>
        <span id="zoom-label">100%</span>
      </div>
      <div id="toolbar-right">
        <select id="example-select" onchange="loadExample(this.value)">
          <option value="">— Examples —</option>
          <option value="half_adder">Half Adder</option>
          <option value="full_adder">Full Adder</option>
          <option value="mux4">4:1 MUX</option>
          <option value="decoder">2:4 Decoder</option>
          <option value="dff">D Flip-Flop</option>
          <option value="comparator">1-bit Comparator</option>
        </select>
      </div>
    </div>

    <div id="main">
      <div id="editor-pane">
        <div class="pane-header">
          <span>VHDL Source</span>
          <span id="editor-status" class="status-ok">●</span>
        </div>
        <div id="editor-wrap">
          <div id="monaco-editor"></div>
        </div>
        <div id="error-panel" style="display:none"></div>
      </div>

      <div id="resizer"></div>

      <div id="canvas-pane">
        <div class="pane-header">
          <span>Circuit Diagram</span>
          <span id="canvas-info"></span>
        </div>
        <div id="canvas-wrap">
          <canvas id="circuit-canvas"></canvas>
          <div id="loading-overlay" style="display:none">
            <div id="loading-box">
              <div class="spinner"></div>
              <div>Synthesizing circuit…</div>
            </div>
          </div>
          <div id="empty-overlay">
            <div id="empty-box">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <rect x="4" y="4" width="40" height="40" rx="4" stroke="#aaa" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
                <path d="M16 24 L24 16 L32 24 L24 32 Z" stroke="#aaa" stroke-width="2" fill="none"/>
                <circle cx="24" cy="24" r="3" fill="#aaa"/>
              </svg>
              <p>Write VHDL and click <strong>Synthesize</strong></p>
              <p style="font-size:11px;color:#aaa;margin-top:4px">Ctrl+Enter to run</p>
            </div>
          </div>
        </div>
        <div id="statusbar">
          <span id="sb-entity">No circuit loaded</span>
          <span class="sb-sep">|</span>
          <span id="sb-pos">x: 0, y: 0</span>
          <span class="sb-sep">|</span>
          <span id="sb-zoom">100%</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
