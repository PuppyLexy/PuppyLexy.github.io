<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>Degree tracker | Lexy Goad</title>
  <meta name="description" content="Course planner for the CpE/EE dual degree: mark courses done and filter by semester or gateway status.">
  <meta name="theme-color" content="#e2e6e4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .page {
      max-width: 64rem;
    }

    h1 {
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .sub {
      margin-top: 0.5rem;
      color: var(--ink-soft);
    }

    .progress {
      margin-top: 2rem;
      max-width: 32rem;
      font-family: var(--sans);
      font-size: 0.9375rem;
    }

    .progress progress {
      display: block;
      width: 100%;
      height: 6px;
      margin-top: 0.5rem;
      border: 0;
      border-radius: 0;
      background: var(--rule);
      color: var(--ink);
      accent-color: var(--ink);
    }

    .progress progress::-webkit-progress-bar {
      background: var(--rule);
    }

    .progress progress::-webkit-progress-value {
      background: var(--ink);
    }

    .progress progress::-moz-progress-bar {
      background: var(--ink);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem 1.25rem;
      margin-top: 2rem;
      font-family: var(--sans);
      font-size: 0.9375rem;
    }

    .controls button {
      padding: 0.25rem 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: none;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }

    .controls button:hover {
      color: var(--ink);
    }

    .controls button[aria-pressed="true"] {
      color: var(--ink);
      border-bottom-color: var(--mark);
    }

    .hint {
      margin-top: 0.75rem;
      font-family: var(--sans);
      font-size: 0.875rem;
      color: var(--muted);
    }

    .term {
      margin-top: 2.5rem;
    }

    .term h2 {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--ink);
      font-size: 1.2rem;
      font-weight: 500;
    }

    .term h2 span {
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--muted);
    }

    .term[hidden] {
      display: none;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .course {
      display: block;
      width: 100%;
      min-height: 4.5rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--ink);
      border-left: 5px solid var(--mark);
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .course[hidden] {
      display: none;
    }

    .course:hover {
      background: var(--ground-deep);
    }

    .course[aria-pressed="true"] {
      border-left-color: var(--ink);
      background: var(--ink);
      color: var(--ground);
    }

    .course .code {
      display: block;
      font-family: var(--sans);
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .course .name {
      display: block;
      margin-top: 0.15rem;
      font-size: 0.9375rem;
      line-height: 1.3;
      opacity: 0.85;
    }

    .course .flags {
      display: block;
      margin-top: 0.35rem;
      font-family: var(--sans);
      font-size: 0.75rem;
      opacity: 0.8;
    }

    .key {
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      margin-right: 0.35rem;
      vertical-align: -0.05rem;
      border: 1px solid var(--ink);
    }

    .key--todo {
      border-left: 5px solid var(--mark);
      width: 0.9rem;
    }

    .key--done {
      background: var(--ink);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1.5rem;
      margin-top: 1.5rem;
      font-family: var(--sans);
      font-size: 0.875rem;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <a class="home" href="./">deaddog.dev</a>
    <nav class="site-nav" aria-label="Main">
      <a href="./">Home</a>
      <a href="blog.html">Blog</a>
      <a href="resume.html">Resume</a>
    </nav>
  </header>

  <main class="page" id="content">
    <h1>Degree tracker</h1>
    <p class="sub">CpE / EE dual degree, Fall 2025 catalog.</p>

    <div class="progress">
      <p id="progress-text" aria-live="polite">0 of 0 courses done</p>
      <progress id="progress-bar" max="100" value="0" aria-labelledby="progress-text"></progress>
    </div>

    <div class="controls" id="filters" role="group" aria-label="Filter courses">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
      <button type="button" data-filter="remaining" aria-pressed="false">Remaining</button>
      <button type="button" data-filter="fall" aria-pressed="false">Fall only</button>
      <button type="button" data-filter="spring" aria-pressed="false">Spring only</button>
      <button type="button" data-filter="gateway" aria-pressed="false">Gateway classes</button>
    </div>

    <p class="legend">
      <span><span class="key key--done"></span>Done</span>
      <span><span class="key key--todo"></span>Still to take</span>
      <span>* co-requisite</span>
    </p>
    <p class="hint">Select a course to mark it done. Your progress is saved in this browser.</p>

    <div id="board"></div>
  </main>

  <footer class="site-footer">CpE / EE dual degree, Fall 2025 catalog.</footer>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "lexy-dualdegree-v1";

      // status: "done" or "todo". flags: any of fall, spring, gateway, coreq.
      const TERMS = [
        {
          title: "Additional required credits",
          courses: [
            { id: "HUM1", code: "HUM 1", name: "Humanities Elective 1", status: "done" },
            { id: "HUM2", code: "HUM 2", name: "Humanities Elective 2", status: "done" },
            { id: "SOC1", code: "SOC 1", name: "Social Science Elective 1", status: "done" },
            { id: "SOC2", code: "SOC 2", name: "Social Science Elective 2", status: "done" },
            { id: "NATSCI", code: "Natural Science Lab", name: "Natural Science Lab", status: "done" },
            { id: "TECH1", code: "Tech 1", name: "Technology Elective 1", status: "done" },
            { id: "CPE1", code: "CpE 1", name: "CpE Elective 1", status: "todo" },
            { id: "CPE2", code: "CpE 2", name: "CpE Elective 2", status: "todo" },
            { id: "EE1", code: "EE 1", name: "EE Elective 1", status: "todo" },
          ],
        },
        {
          title: "Freshman year",
          courses: [
            { id: "MATH1910", code: "MATH 1910", name: "Calculus I", status: "done" },
            { id: "PHYS2110", code: "PHYS 2110/2111", name: "Physics I & Lab", status: "done" },
            { id: "MATH1920", code: "MATH 1920", name: "Calculus II", status: "done" },
            { id: "COMP1900", code: "COMP 1900", name: "Intro to Computing", status: "done" },
            { id: "ENGL1010", code: "ENGL 1010", name: "English Composition I", status: "done" },
            { id: "ENGL1020", code: "ENGL 1020", name: "English Composition II", status: "done" },
            { id: "ENGR1010", code: "ENGR 1010", name: "Intro to Engineering", status: "done" },
            { id: "EECE1208", code: "EECE 1208", name: "Intro to EECE", status: "todo" },
          ],
        },
        {
          title: "Sophomore year",
          courses: [
            { id: "PHYS2120", code: "PHYS 2120/2121", name: "Physics II & Lab", status: "done" },
            { id: "COMP2700", code: "COMP 2700", name: "Discrete Structures", status: "todo" },
            { id: "MATH2110", code: "MATH 2110", name: "Calculus III", status: "todo" },
            { id: "EECE2222", code: "EECE 2222", name: "Digital Circuit Design", status: "todo" },
            { id: "MATH2120", code: "MATH 2120", name: "Linear Algebra", status: "done" },
            { id: "COMP2150", code: "COMP 2150", name: "Object-oriented Programming", status: "todo" },
            { id: "EECE2207", code: "EECE 2207", name: "Circuit Analysis I", status: "done", flags: ["gateway"] },
            { id: "EECE2201", code: "EECE 2201", name: "Intro to Logic Design", status: "done" },
            { id: "EECE2203", code: "EECE 2203", name: "Logic Design Lab", status: "done" },
            { id: "ENGL2201", code: "ENGL 2201/2202", name: "Technical Writing", status: "done" },
          ],
        },
        {
          title: "Junior year",
          courses: [
            { id: "MATH3242", code: "MATH 3242", name: "Differential Equations", status: "todo" },
            { id: "EECE3201", code: "EECE 3201*", name: "Electronics I", status: "todo", flags: ["gateway", "coreq"] },
            { id: "EECE3203", code: "EECE 3203*", name: "Signals & Systems", status: "todo", flags: ["gateway", "coreq"] },
            { id: "EECE3207", code: "EECE 3207", name: "Circuit Analysis II", status: "todo" },
            { id: "EECE3211", code: "EECE 3211*", name: "Microprocessors", status: "todo", flags: ["gateway", "coreq"] },
            { id: "EECE3213", code: "EECE 3213", name: "Electronics Lab", status: "todo" },
            { id: "EECE3270", code: "EECE 3270", name: "Electrical Machines", status: "todo" },
            { id: "EECE3240", code: "EECE 3240", name: "Electromagnetics I", status: "todo", flags: ["spring"] },
            { id: "ENGL3603", code: "ENGL 3603", name: "Advanced Technical Writing", status: "done" },
          ],
        },
        {
          title: "Senior year",
          courses: [
            { id: "EECE4278", code: "EECE 4278", name: "Computer Architecture", status: "todo", flags: ["fall"] },
            { id: "EECE4081", code: "EECE 4081", name: "CpE Senior Elective", status: "todo", flags: ["fall"] },
            { id: "EECE4279", code: "EECE 4279", name: "Senior Design I", status: "todo", flags: ["fall"] },
            { id: "EECE4251", code: "EECE 4251", name: "Control Systems", status: "todo", flags: ["fall"] },
            { id: "EECE4235", code: "EECE 4235", name: "Communications Systems", status: "todo" },
            { id: "EECE4991", code: "EECE 4991", name: "Senior Seminar", status: "todo" },
            { id: "EECE4201", code: "EECE 4201", name: "Power Electronics", status: "todo", flags: ["fall"] },
            { id: "EECE4280", code: "EECE 4280", name: "CpE Senior Design", status: "todo", flags: ["spring"] },
          ],
        },
      ];

      const FLAG_LABELS = {
        fall: "Fall",
        spring: "Spring",
        gateway: "Gateway",
        coreq: "Co-req",
      };

      const board = document.getElementById("board");
      const filterBar = document.getElementById("filters");
      const progressText = document.getElementById("progress-text");
      const progressBar = document.getElementById("progress-bar");

      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch {
        saved = {};
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        } catch {
          /* storage blocked or full: progress just won't stick */
        }
      }

      const state = new Map();
      const buttons = new Map();
      const sections = [];
      let filter = "all";

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function build() {
        const frag = document.createDocumentFragment();

        for (const term of TERMS) {
          const section = el("section", "term");
          const count = el("span");
          const heading = el("h2");
          heading.append(term.title, count);
          const grid = el("div", "courses");

          for (const course of term.courses) {
            const status = saved[course.id] === "done" || saved[course.id] === "todo"
              ? saved[course.id]
              : course.status;
            state.set(course.id, status);

            const btn = el("button", "course");
            btn.type = "button";
            btn.dataset.id = course.id;
            btn.append(el("span", "code", course.code), el("span", "name", course.name));
            if (course.flags) {
              btn.append(el("span", "flags", course.flags.map((f) => FLAG_LABELS[f]).join(", ")));
            }
            buttons.set(course.id, { btn, course });
            grid.append(btn);
          }

          section.append(heading, grid);
          sections.push({ section, count, term });
          frag.append(section);
        }

        board.append(frag);
      }

      function matches(course, status) {
        switch (filter) {
          case "completed": return status === "done";
          case "remaining": return status === "todo";
          case "fall":
          case "spring":
          case "gateway": return (course.flags || []).includes(filter);
          default: return true;
        }
      }

      function update() {
        let done = 0;
        const total = buttons.size;

        for (const [id, { btn, course }] of buttons) {
          const status = state.get(id);
          if (status === "done") done++;
          btn.setAttribute("aria-pressed", String(status === "done"));
          btn.hidden = !matches(course, status);
        }

        for (const { section, count, term } of sections) {
          const doneHere = term.courses.filter((c) => state.get(c.id) === "done").length;
          count.textContent = `${doneHere} of ${term.courses.length} done`;
          section.hidden = term.courses.every((c) => buttons.get(c.id).btn.hidden);
        }

        const pct = Math.round((done / total) * 100);
        progressText.textContent = `${done} of ${total} courses done (${pct}%)`;
        progressBar.value = pct;
      }

      board.addEventListener("click", (e) => {
        const btn = e.target.closest("button.course");
        if (!btn) return;
        const id = btn.dataset.id;
        const next = state.get(id) === "done" ? "todo" : "done";
        state.set(id, next);
        saved[id] = next;
        persist();
        update();
      });

      filterBar.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-filter]");
        if (!btn) return;
        filter = btn.dataset.filter;
        for (const b of filterBar.querySelectorAll("button")) {
          b.setAttribute("aria-pressed", String(b === btn));
        }
        update();
      });

      build();
      update();
    })();
  </script>
</body>
</html>
