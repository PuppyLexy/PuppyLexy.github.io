<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>Blog | Lexy Goad</title>
  <meta name="description" content="Notes on engineering, tools and whatever Lexy Goad is building.">
  <meta name="theme-color" content="#e2e6e4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .intro h1 {
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .intro p {
      margin-top: 0.75rem;
      color: var(--ink-soft);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1.25rem;
      margin-top: 2.5rem;
      font-family: var(--sans);
      font-size: 0.9375rem;
    }

    .filters button {
      padding: 0.25rem 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: none;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }

    .filters button:hover {
      color: var(--ink);
    }

    .filters button[aria-pressed="true"] {
      color: var(--ink);
      border-bottom-color: var(--mark);
    }

    .posts {
      margin-top: 1.5rem;
      border-top: 1px solid var(--rule);
    }

    .post {
      display: grid;
      grid-template-columns: 5.5rem 1fr;
      gap: 0 1.5rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--rule);
    }

    .post .when {
      font-family: var(--sans);
      font-size: 0.875rem;
      color: var(--muted);
      padding-top: 0.3rem;
    }

    .post h2 {
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .post h2 a {
      text-decoration: none;
    }

    .post h2 a:hover {
      text-decoration: underline;
    }

    .post p {
      margin-top: 0.4rem;
      font-size: 1rem;
      color: var(--ink-soft);
    }

    .post .tags {
      margin-top: 0.6rem;
      font-family: var(--sans);
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .post .soon {
      display: block;
      margin-top: 0.15rem;
      font-size: 0.8125rem;
      font-style: italic;
    }

    .empty {
      padding: 2rem 0;
      color: var(--muted);
    }

    @media (max-width: 30rem) {
      .post {
        grid-template-columns: 1fr;
      }

      .post .when {
        padding-top: 0;
        margin-bottom: 0.25rem;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <a class="home" href="./">deaddog.dev</a>
    <nav class="site-nav" aria-label="Main">
      <a href="./">Home</a>
      <a href="blog.html" aria-current="page">Blog</a>
      <a href="resume.html">Resume</a>
    </nav>
  </header>

  <main class="page" id="content">
    <div class="intro">
      <h1>Things I've figured out and written down</h1>
      <p>Notes on engineering, tools, and whatever I'm building.</p>
    </div>

    <div class="filters" id="filters" role="group" aria-label="Filter posts by topic">
      <button type="button" data-tag="all" aria-pressed="true">All</button>
      <button type="button" data-tag="hardware" aria-pressed="false">Hardware</button>
      <button type="button" data-tag="ai" aria-pressed="false">AI</button>
      <button type="button" data-tag="web" aria-pressed="false">Web</button>
      <button type="button" data-tag="tools" aria-pressed="false">Tools</button>
    </div>

    <div class="posts" id="posts" aria-live="polite"></div>
  </main>

  <footer class="site-footer">Lexy Goad</footer>

  <script>
    (() => {
      "use strict";

      // Set `url` once a post is published. Posts without a url render as plain text.
      const POSTS = [
        {
          date: "2025-04",
          label: "Apr 2025",
          title: "VHDL to Logisim: lessons from building an AI synthesis tool",
          excerpt: "I built a tool that converts VHDL hardware descriptions into Logisim circuits using Claude. Here's what I learned about AI-assisted hardware synthesis and where it breaks down.",
          tags: ["ai", "hardware"],
          url: null,
        },
        {
          date: "2025-03",
          label: "Mar 2025",
          title: "Writing a degree tracker that actually helps me graduate",
          excerpt: "My university's built-in planner is terrible. So I built my own: an interactive course planner that maps prerequisites, credits, and schedule conflicts in real time.",
          tags: ["web", "tools"],
          url: null,
        },
        {
          date: "2025-02",
          label: "Feb 2025",
          title: "GitHub Pages is a surprisingly good static host for side projects",
          excerpt: "Before paying for hosting, try this: a repo, a CNAME record, and a custom domain. I run deaddog.dev for free this way and the deploy pipeline is just a git push.",
          tags: ["web", "tools"],
          url: null,
        },
        {
          date: "2025-01",
          label: "Jan 2025",
          title: "How I set up my VHDL dev environment from scratch",
          excerpt: "Setting up GHDL, Logisim, and a workflow that doesn't make you want to close the laptop. A quick-start guide for anyone doing digital design without a lab.",
          tags: ["hardware", "tools"],
          url: null,
        },
      ];

      const list = document.getElementById("posts");
      const filters = document.getElementById("filters");
      let activeTag = "all";

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function renderPost(post) {
        const article = el("article", "post");

        const when = el("div", "when");
        const time = el("time", "", post.label);
        time.dateTime = post.date;
        when.append(time);
        if (!post.url) when.append(el("span", "soon", "Coming soon"));

        const body = el("div");
        const heading = el("h2");
        if (post.url) {
          const link = el("a", "", post.title);
          link.href = post.url;
          heading.append(link);
        } else {
          heading.append(post.title);
        }

        body.append(
          heading,
          el("p", "", post.excerpt),
          el("p", "tags", post.tags.join(", "))
        );
        article.append(when, body);
        return article;
      }

      function render() {
        const shown = activeTag === "all"
          ? POSTS
          : POSTS.filter((p) => p.tags.includes(activeTag));

        list.replaceChildren();

        if (!shown.length) {
          list.append(el("p", "empty", `Nothing tagged "${activeTag}" yet.`));
          return;
        }
        list.append(...shown.map(renderPost));
      }

      filters.addEventListener("click", (e) => {
        const button = e.target.closest("button[data-tag]");
        if (!button) return;
        activeTag = button.dataset.tag;
        for (const b of filters.querySelectorAll("button")) {
          b.setAttribute("aria-pressed", String(b === button));
        }
        render();
      });

      render();
    })();
  </script>
</body>
</html>
